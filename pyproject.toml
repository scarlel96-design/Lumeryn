[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumeryn"
version = "0.0.0"
description = "Lumeryn architecture scaffold — not an AI runtime yet"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
