name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-contracts:
    name: architecture-and-contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified checkout v4 commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified setup-python v5 commit
        with:
          python-version: "3.12"
      - name: Install package and test-only schema validator
        run: python -m pip install -e ".[dev]"
      - name: Verify required design records
        run: python scripts/verify_project.py check --wo WO-AGENT-00
      - name: Verify architecture boundaries
        run: python scripts/check_architecture.py
      - name: Verify module example manifest
        run: python scripts/validate_contracts.py module plugins/examples/math-tool/manifest.json
      - name: Compile source and test files
        run: python -m compileall -q src scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
